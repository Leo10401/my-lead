# Devtacet Lead Pipeline — Spatial Dark Theme
[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#18181b"
codeBackgroundColor = "#18181b"
textColor = "#f4f4f5"
linkColor = "#818cf8"
borderColor = "#27272a"
showWidgetBorder = false
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
codeTextColor = "#e4e4e7"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 500, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#6366f1", "#8b5cf6", "#ec4899", "#14b8a6", "#f59e0b", "#ef4444", "#22c55e"]

violetColor = "#8b5cf6"
blueColor   = "#6366f1"
greenColor  = "#22c55e"
yellowColor = "#f59e0b"
orangeColor = "#f97316"
redColor    = "#ef4444"

[theme.sidebar]
backgroundColor = "#050507"
secondaryBackgroundColor = "#09090b"
codeBackgroundColor = "#09090b"
borderColor = "#1e1e24"
